name: E5577 Control | Linux + Windows desktop packages

on:
  push:
    branches: [main]
    tags: [v1.0.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e5577-control-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux x86-64
            artifact: e5577-control-linux-x86_64
          - os: windows-2022
            label: Windows x86-64
            artifact: e5577-control-windows-x86_64

    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Windows Inno Setup
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress --limit-output
          $inno = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $inno)) { throw "Inno Setup compiler not found" }
          Add-Content $env:GITHUB_ENV "INNO_SETUP_COMPILER=$inno"

      - name: Install app and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller==6.16.0" "pillow==11.3.0"

      - name: Offline Python and Qt UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/local_gate.py

      - name: Build, offline frozen smoke, and portable archive
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/build_desktop.py

      - name: Upload unsigned candidate package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/packages/*
          if-no-files-found: error
          retention-days: 14


  release-v1:
    name: Publish verified v1.0.0 assets
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.0.0'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact tagged source with annotated tag history
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify immutable annotated tag and version
        env:
          TAG: v1.0.0
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          grep -Fqx 'version = "1.0.0"' pyproject.toml
          test -s docs/en/RELEASE_NOTES_v1.0.0.md
          test -s docs/it/RELEASE_NOTES_v1.0.0.md

      - name: Download both freshly generated native build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: e5577-control-*
          path: downloaded-artifacts

      - name: Assemble exact four packages and one SHA-256 manifest
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for filename in             e5577-control-v1.0.0-linux-x86_64.deb             e5577-control-v1.0.0-linux-x86_64.tar.gz             e5577-control-v1.0.0-windows-x86_64-setup.exe             e5577-control-v1.0.0-windows-x86_64.zip; do
            mapfile -t matches < <(find downloaded-artifacts -type f -name "$filename")
            test "${#matches[@]}" -eq 1
            test -s "${matches[0]}"
            cp -- "${matches[0]}" "release-assets/$filename"
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 4
          (cd release-assets && sha256sum e5577-control-v1.0.0-* > SHA256SUMS.txt)
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          test "$(wc -l < release-assets/SHA256SUMS.txt)" -eq 4
          cat release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release without replacing historical assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$TAG" release-assets/*             --repo "$GITHUB_REPOSITORY"             --verify-tag             --title "E5577 Control v1.0.0"             --notes-file docs/en/RELEASE_NOTES_v1.0.0.md             --latest
