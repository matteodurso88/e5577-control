<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Pocket Radio Manager</title>
  <desc id="desc">A white pocket modem beneath a cyan radio antenna on a dark blue square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172A45"/>
      <stop offset="1" stop-color="#091627"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8AEAFF"/>
      <stop offset="1" stop-color="#36A7EB"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="53.25" fill="none" stroke="#6C9DB9" stroke-opacity=".28" stroke-width="1.5"/>
  <g id="radio-waves" fill="none" stroke="url(#wave)" stroke-linecap="round" stroke-width="10">
    <path d="M 101 66 C 90 79 90 95 101 108"/>
    <path d="M 82 47 C 62 69 62 105 82 127"/>
    <path d="M 155 66 C 166 79 166 95 155 108"/>
    <path d="M 174 47 C 194 69 194 105 174 127"/>
  </g>
  <g id="antenna" fill="#FCFDFF">
    <circle cx="128" cy="88" r="13"/>
    <path d="M 122.5 101 L 133.5 101 L 149 143 L 107 143 Z"/>
  </g>
  <g id="modem">
    <rect x="48" y="143" width="160" height="75" rx="19" fill="#FCFDFF"/>
    <rect x="59" y="155" width="138" height="52" rx="12" fill="#091627"/>
    <rect x="77" y="176" width="67" height="12" rx="6" fill="#E9F4FB" opacity=".92"/>
    <circle cx="169" cy="182" r="7.5" fill="#69D7F7"/>
  </g>
</svg>
