[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e5577-control"
version = "1.0.0"
description = "E5577 Control: desktop management for Huawei E5577 LTE devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
    "huawei-lte-api>=1.11,<2",
    "keyring>=25,<27",
    "SecretStorage>=3.2,<4; sys_platform == 'linux'",
    "platformdirs>=4,<5",
    "psutil>=5.9,<8",
]

[project.scripts]
e5577-control = "pocket_manager.qt_app:main"
pocket-radio-manager = "pocket_manager.qt_app:main"

[tool.setuptools.packages.find]
include = ["pocket_manager*"]
